server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework
  reactive:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        same-site: lax
        http-only: true
        secure: false

spring:
  application:
    name: bff-gateway
  codec:
    max-in-memory-size: 30MB
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
      routes:
        - id: storage-shared-with-me
          uri: ${STORAGE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/files/shared-with-me
          filters:
            - TokenRelay=
            - RewritePath=/api/files/shared-with-me, /files/shared
          order: 0
        - id: storage-files
          uri: ${STORAGE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/files/**
          filters:
            - TokenRelay=
            - RewritePath=/api/files(?<segment>/?.*), /files${segment}
          order: 1
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:gateway-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:gateway-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:5173/login/oauth2/code/{registrationId}}"
            scope:
              - openid
              - profile
              - email

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:nextu-files}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:admin-cli-service-secret}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
