server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework
  reactive:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        same-site: lax
        http-only: true
        secure: false  # false for local HTTP dev — set true in production with HTTPS

spring:
  application:
    name: bff-gateway
  codec:
    max-in-memory-size: 30MB
  cloud:
    gateway:
      handler-mapping:
        order: 5
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username
          keycloak-register:
            # Same realm/client as "keycloak" but targets the registration form directly.
            # Routing the authorization request through Spring Security (instead of a hand-built
            # link) ensures a matching state/nonce is stored, so the OAuth2 callback validates correctly.
            authorization-uri: ${KEYCLOAK_REGISTRATION_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/registrations}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:gateway-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:gateway-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:5173/login/oauth2/code/{registrationId}}"
            scope:
              - openid
              - profile
              - email
          keycloak-register:
            provider: keycloak-register
            client-id: ${KEYCLOAK_CLIENT_ID:gateway-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:gateway-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:5173/login/oauth2/code/{registrationId}}"
            scope:
              - openid
              - profile
              - email

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:nextu-files}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:admin-cli-service-secret}
  oidc:
    end-session-uri: ${KEYCLOAK_END_SESSION_URI:http://localhost:8180/realms/nextu-files/protocol/openid-connect/logout}
    client-id: ${KEYCLOAK_CLIENT_ID:gateway-client}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
